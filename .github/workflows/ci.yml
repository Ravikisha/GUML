name: ci

# Every gate this project verifies by hand runs here. That is the whole point: a per-element
# allocation once pushed compile latency 24% over its committed budget while every test stayed
# green, and only the benchmark saw it. A check that lives in someone's shell history is not a
# check.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The language server is a separate binary with its own dependency tree, so a workspace
      # test run can pass while it fails to build.
      - name: Language server builds
        run: cargo build -p guml-lsp

      # Compiled, not run: the numbers need a quiet machine to mean anything, but a benchmark
      # that stops compiling is a benchmark nobody will run again.
      - name: Benchmarks compile
        run: cargo bench -p guml-compiler --no-run

  guml-sources:
    # Every `.guml` file in the repository has to be formatted and valid. The fixtures back the
    # token measurements in the research report, so one that stops compiling is a broken claim.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Formatted
        run: cargo run -q -p guml-cli -- fmt --check fixtures/*.guml bench/phase0/examples/*.guml bench/guml-bench/reference/*.guml

      - name: Valid
        run: cargo run -q -p guml-cli -- validate fixtures bench/phase0/examples bench/guml-bench/reference

      # The escape-hatch budget. A rising rate is the early warning that the vocabulary is hitting an
      # expressiveness cliff, and a warning nothing fails on is a statistic. Raising this number requires
      # saying which construct could not be expressed.
      - name: Escape-hatch budget
        run: cargo run -q -p guml-cli -- capabilities fixtures bench/phase0/examples --max-escapes 3

      # The strongest test of a code generator: emit everything, then typecheck the result under
      # `--strict`. Five silent mis-lowerings have been caught this way and by nothing else.
      - name: Emitted TypeScript typechecks
        run: |
          pnpm install --frozen-lockfile
          node scripts/typecheck-emitted.mjs
        shell: bash

      # Typechecking and executing catch different things. `tsc` found a DOM prop React does not
      # have; only rendering can notice a table with no header row or a control with no name.
      - name: Emitted components render
        run: node scripts/render-emitted.mjs

      # The wc backend emits plain JavaScript, so neither `tsc` nor the React renderer sees it. This
      # runs it: a shimmed `HTMLElement` is enough to execute every binding and every action body, which
      # is what caught a JSX interpolation leaking into a plain-JS file.
      - name: Web Components output runs
        run: node scripts/check-wc.mjs

      # The example registry package. Three checks, and the third earns its place: it typechecks the
      # *emitted* component against the package's own components. A package declares `attrs` and the compiler
      # emits them as props; until this ran, nothing verified the component accepted them. It found `of=` and
      # `kind=` silently dropped, a missing `aria-label`, and a `field`-kind component emitting its state name
      # as children instead of a two-way binding.
      - name: the example registry package agrees with its own components
        run: |
          cargo run -q -p guml-cli -- registry --validate packages/guml-widgets
          cd packages/guml-widgets && pnpm typecheck && pnpm typecheck:example
          cd "$GITHUB_WORKSPACE"
          cargo run -q -p guml-cli -- registry --validate packages/guml-shadcn
          cd packages/guml-shadcn && pnpm typecheck && pnpm typecheck:example
        shell: bash

      # The extension sat outside the pnpm workspace, so its dependencies were never installed and it was
      # the one piece of first-party TypeScript with no typecheck — and it is the piece users install.
      - name: VS Code extension typechecks
        run: cd editors/vscode && pnpm typecheck

      # The mutation-recovery gate. Definitionally-invalid single-token edits injected into every
      # known-good document in the repository, measured two ways: did the compiler notice, and did the
      # report stay out of lines the mutation did not touch. Both are `ROADMAP.md` Phase 2 gate criteria,
      # and neither was measured by anything until this existed.
      - name: mutation recovery gate
        run: cargo test -p guml-compiler --test mutation -- --nocapture

      # The tree-sitter scanner's tag lists are generated from the registry. They had gone stale — 8 text
      # tags against a registry of 16 — which silently broke prose lexing for half the vocabulary.
      - name: tree-sitter tag lists are current
        run: cd editors/tree-sitter-guml && node scripts/gen-tags.mjs --check

      # The grammar itself. `npm test` is the 14-case corpus *plus* a parse of every real `.guml` in the
      # repository, and the second half is the one that earns its keep: three separate scanner bugs were
      # live while the corpus passed 12 of 12, because a hand-written corpus only contains cases someone
      # thought of. The grammar is deliberately outside the pnpm workspace — `tree-sitter-cli` fetches a
      # platform binary on install, which does not belong in the lockfile the docs site builds from.
      - name: tree-sitter grammar parses every fixture
        run: cd editors/tree-sitter-guml && npm ci --no-audit --no-fund && npm test

      # The GUML-Bench reference answers get their own escape-hatch budget. **Per document, not a total** —
      # one `js` block each at most. Six of the nine use exactly one and three use none, and every hatch is
      # named in its file's header with the construct that could not be expressed. These are whole task
      # answers, so the count measures how far the vocabulary reaches rather than being a number to drive to
      # zero; raising it requires saying which construct forced it.
      - name: reference answers stay inside their escape-hatch budget
        run: cargo run -q -p guml-cli -- capabilities bench/guml-bench/reference --max-escapes 1

      # GUML-Bench's dataset. Fails on a malformed task — in particular one that would give different arms
      # different prompts, which is the defect that would make a published number wrong rather than thin.
      - name: GUML-Bench dataset is well-formed
        run: node bench/guml-bench/preflight.mjs

      # Arm B4's TOON encoder, round-tripped. The *rival's* arm is the one that most needs a test: a bug
      # that makes GUML look better is a bug nobody reports, and an encoding that cannot be decoded is not
      # a smaller serialisation — it is a shorter string.
      - name: the TOON encoder is lossless
        run: node bench/guml-bench/selftest.mjs

  phase0:
    # The harness that decides whether the project continues. Everything here runs without an
    # API key; the generations themselves do not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Prompt budget, example leakage, registry slices, and that the ten React references
      # still typecheck.
      - name: Harness preflight
        run: node bench/phase0/preflight.mjs

      # Scores synthetic generations of known shape. A miscount here would produce a plausible,
      # wrong answer to the only question Phase 0 exists to ask.
      - name: Scoring self-test
        run: node bench/phase0/selftest.mjs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # The site regenerates its code samples from the real fixtures and the real compiler, so
      # this also proves the compiler still builds.
      - run: pnpm --filter docs build

      - run: pnpm --filter docs lint

      - run: pnpm --filter docs typecheck

      # The compiler's theme decides which utility classes the emitted output carries, and Tailwind
      # cannot discover classes produced at runtime. A stale generated list means a live preview
      # renders class names with no rule — half-styled, with nothing to indicate it.
      - name: Theme class list is current
        run: pnpm --filter docs check:theme

      # The site keeps a TypeScript highlighter because server rendering has to be synchronous.
      # That is a second implementation of a language rule, so it is held to the compiler's
      # answer span for span rather than by review.
      - name: Highlighter agrees with the compiler
        run: pnpm --filter docs check:highlight

      # Docs samples that carry a live preview are compiled by the real CLI, and the check fails on a
      # warning as well as an error. A sample that stopped compiling would not fail the build on its
      # own — it would quietly replace an interface with a diagnostics panel, on a page whose
      # argument is that the language works.
      - name: Docs previews compile clean
        run: pnpm --filter docs check:previews

  package:
    # The npm package ships the compiler as wasm. Its build output and its tests are separate
    # from the Rust workspace's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @guml/core typecheck

      # The runtime evaluator is a second implementation of semantics the Rust compiler also
      # owns. Several of these tests exist purely to pin that parity.
      - name: Runtime tests
        run: pnpm --filter @guml/core test

      # `build`, not `build:ts`. The latter runs `clean` and emits only the TypeScript, so it deletes
      # the CDN bundle without rebuilding it — leaving a `dist/` that looks complete and has no
      # `guml.global.js` in it. The CDN gate below is what found that.
      - name: Build output
        run: pnpm --filter @guml/core build:ts && pnpm --filter @guml/core build:global

      # Two ways a committed build artifact goes wrong, and both were live before this ran.
      #
      # It must be IN the tarball: wasm-pack writes a `.gitignore` containing `*` into its out-dir and
      # npm honours it over the `files` allowlist, so `npm publish` would have shipped a compiler
      # package with no compiler in it. Invisible to every other gate, because they all run against the
      # working tree where the file plainly exists.
      #
      # It must MATCH its source: `prepublishOnly` ran `build:ts` without `build:wasm`, so a publish
      # shipped whatever binary happened to be committed. It had drifted by five days.
      # Split out of the core so a consumer who only formats or only highlights does not download a
      # compiler: 178 KB against 787 KB. The formatter's tests running under `node --test` is itself the
      # check — the core wasm is built for the web target and cannot load in Node at all.
      - name: The split packages
        run: |
          pnpm --filter @guml/fmt build
          pnpm --filter @guml/fmt typecheck && pnpm --filter @guml/fmt test
          pnpm --filter @guml/highlight typecheck

      - name: The committed wasm ships, and matches its source
        run: |
          cargo install wasm-pack --locked
          node scripts/check-wasm-fresh.mjs

      # The docs site is a deployed artifact with three API routes and a playground that runs the
      # compiler. Until this ran here, a build break surfaced at deploy time — the one moment you
      # cannot afford to find it.
      # A typo'd package name renders as a link to a registry 404, and a stale size keeps asserting a
      # number that moved at the last publish. Neither is visible to a build.
      # Three bindings over one compiler is three chances to disagree about one document, and this
      # repository has been bitten by exactly that shape of bug three times already. `test_agreement.py`
      # compiles every fixture through both the CLI and Python and compares the bytes.
      - name: Python package
        run: |
          pip install maturin pytest jinja2
          cd crates/guml-python
          pip install .
          python -m pytest tests -q

      # `pnpm audit` gates the JavaScript dependencies; nothing gated the Rust ones, which is the
      # larger surface. Found RUSTSEC-2026-0177 (a missing `Sync` bound in pyo3) on its first run.
      # A real client speaks newline-delimited JSON-RPC over stdio; so does this. Catches the failure
      # that unit tests cannot see — a server that works and that no client can talk to.
      - name: MCP server conformance
        run: node scripts/check-mcp.mjs

      - name: Rust dependency review
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      - name: The packages the docs name exist, at the sizes they claim
        run: pnpm --filter docs check:packages

      - name: Docs site builds
        run: |
          pnpm --filter docs typecheck
          pnpm --filter docs build
        env:
          DEMO_COOKIE_SECRET: ci-build-only-not-a-deployment-secret

      # The compiler checks accessibility in the HTML it emits; until this ran, the site documenting
      # that compiler had never been checked at all. Found two pages carrying a second `<main>`.
      - name: Docs site accessibility
        run: |
          cd docs
          pnpm start &
          npx --yes wait-on http://localhost:3000/docs -t 60000
          pnpm check:a11y
        env:
          A11Y_BASE: http://localhost:3000
          DEMO_COOKIE_SECRET: ci-build-only-not-a-deployment-secret
