[package]
name = "guml-ast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GUML abstract syntax tree"

[dependencies]
# For the parsed form of a binding. `guml-syntax` is the lexer and expression grammar; it does
# not depend on the AST, so this is not a cycle.
guml-syntax = { workspace = true }
guml-diagnostics = { workspace = true }
serde = { workspace = true }
